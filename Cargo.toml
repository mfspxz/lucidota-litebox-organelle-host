[package]
name = "litebox-organelle-host"
version = "0.1.0"
edition = "2021"
description = "Hardened organelle execution host: LiteBox (linux_userland) as inner OS personality inside an outer Linux sandbox (namespaces, seccomp, rlimits)"
license = "MIT"

[[bin]]
name = "litebox-organelle-host"
path = "src/main.rs"

[dependencies]
# LiteBox crates (path deps into the local checkout)
litebox = { version = "0.1.0", path = "../litebox/litebox/litebox" }
litebox_shim_linux = { version = "0.1.0", path = "../litebox/litebox/litebox_shim_linux" }
litebox_platform_linux_userland = { version = "0.1.0", path = "../litebox/litebox/litebox_platform_linux_userland" }
litebox_syscall_rewriter = { version = "0.1.0", path = "../litebox/litebox/litebox_syscall_rewriter" }
litebox_common_linux = { version = "0.1.0", path = "../litebox/litebox/litebox_common_linux" }

# Outer sandbox
nix = { version = "0.29", features = ["sched", "signal"] }
seccompiler = "0.5"
libc = "0.2"

# Util
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
# Manifest authentication (P1): Ed25519 signatures over the canonical
# manifest. Industry-standard primitive; no hand-rolled crypto.
ed25519-dalek = "3"

# Organelle migration (wave 4b-1): native Tier A registration surface
organelle-host = { path = "../organelles/crates/organelle-host" }
organelle-manifest = { path = "../organelles/crates/organelle-manifest" }

[profile.release]
# Keep debug info for honest stack traces in the pilot
debug = true
